- name: ENABLE
  prompt: Enable Plugin
  type: bool
  default: true
  help_text: Enable or disable the plugin.
  cmake_export: true

- name: DIRECTORY
  prompt: "Directory to recursively scan for Lua files"
  type: string
  default: "./lua"
  help_text: "The directory that will be scanned for Lua files. The plugin will look for .lua files in this directory and its subdirectories."
  show_if: 
    - ENABLE

