- name: ENABLE
  prompt: Enable python_exp?
  type: bool
  help_text: Enable or disable the ToolProvider.
  cmake_export: true
  default: True
  runtime_export: false

- name: DIRECTORY
  prompt: "Directory to recursively scan for Python files"
  type: string
  default: "./python"
  help_text: "The directory that will be scanned for Python files. The plugin will look for .py files in this directory and its subdirectories."
  show_if:
    - ENABLE
  cmake_export: true
  cmake_help: $help_text$

- name: LIB_DIR
  prompt: Library Directory
  type: string
  default: "python_lib"
  help_text: Directory which contains the Python libraries to be used by the plugin. Libraries in this directory can be loaded by Python scripts.
  show_if:
    - ENABLE
  cmake_export: true
  cmake_help: $help_text$

- name: HIGJACK_REF
  prompt: Hijack Python Refs
  help_text: Hijack python's increment/decrement reference methods.
  type: bool
  default: false
  runtime_export: false