name: ip2hex
version: 0.1.0
description: >
  Convert an IPv4 or IPv6 address string into its integer value (decimal). The
  family is auto-detected from the text ('.' => IPv4, ':' => IPv6). IPv6 yields a
  128-bit value. Inverse of the num2ip encoder.
tags: [ip, network, convert]
method: transform

inputs:
  - name: input
    type: string
    required: true
    description: "An IPv4 (e.g. 192.168.1.1) or IPv6 (e.g. 2001:db8::1) address."

steps:
  - op: ip2bytes
  - op: bswap
    key: 4

outputs:
  - name: output
    format: hex
