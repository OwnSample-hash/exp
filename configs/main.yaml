- name: PLUGIN_INSTALL_DIR
  prompt: Plugin install directory
  type: string
  default: plugins
  help_text: Directory where plugins will be loaded from.

- name: LOG_DIR
  prompt: Log directory
  type: string
  default: logs
  help_text: Directory where logs will be placed.

- name: DEFAULT_CONFIG_FILE
  prompt: Default config file
  type: string
  default: config.yaml
  help_text: Default configuration file to use if no other is specified.

- name: DEFAULT_PREFERRED_UI
  prompt: Default UI type
  type: string
  default: simple_ui
  help_text: Default UI type to use if no other is specified.

- name: BO
  prompt: Build options
  type: menu
  source: build_options.yaml

- name: MODULES
  prompt: Module options
  type: dynamicmenu
  source: plugins/*/config.yaml
  help_text: Select module options.
  help_text_fmt: Options for {filename} plugin.

- name: TOOLS
  prompt: Tool options
  type: dynamicmenu
  source: tools/*/config.yaml
  help_text: Select tool options.
  help_text_fmt: Options for {filename} tool.
